name: Update Calendar

on:
  schedule:
    - cron: '15 2 * * *'  # Runs daily at 02:15 UTC, away from other repository data jobs
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-calendar.yml"
      - "requirements.txt"
      - "genCalendar.py"
      - "genSimpleCalendar.py"
      - "calendar_*.py"
      - "city_source_taxonomy.py"
      - "events_map_generator.py"
      - "geocode*.py"
      - "scrape_*.py"
      - "scripts/canonicalize_calendar_tags.py"
      - "*/event_sources.py"
      - "*/gen_calendar.py"
      - "*/scrape_*.py"
      - "*/manual_events.json"
      - "tests/calendar/validate_calendar_source_exclusions.py"
      - "tests/calendar/validate_source_*.py"
      - "tests/calendar_filtering.test.cjs"
      - "tests/test_calendar_*.py"
      - "tests/test_city_source_taxonomy.py"
      - "tests/test_scrape_*.py"
  workflow_dispatch:  # Allows manual trigger from the Actions tab

permissions:
  contents: write
  actions: write

# Calendar refreshes should not queue behind or compete with unrelated data jobs.
concurrency:
  group: calendar-data-updates
  cancel-in-progress: false

jobs:
  update_calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # One-time source migration: source files own their atomic tags. There is
      # no runtime splitting or interpretation of compound tag names.
      - name: Canonicalize source tags
        if: ${{ github.event_name != 'schedule' }}
        run: |
          python scripts/canonicalize_calendar_tags.py

      # Code-level regression tests remain critical for push/manual runs.
      - name: Run calendar regression tests
        if: ${{ github.event_name != 'schedule' }}
        run: |
          python -m pytest \
            tests/test_calendar_*.py \
            tests/test_city_source_taxonomy.py \
            tests/test_scrape_*.py
          node --test tests/calendar_filtering.test.cjs

      # Coverage/minimum checks are useful diagnostics, but stale content is
      # worse than temporarily missing a desired source/category threshold.
      - name: Check source lens minimums
        if: ${{ github.event_name != 'schedule' }}
        continue-on-error: true
        run: |
          python tests/calendar/validate_source_lens_minimums.py

      - name: Run genCalendar.py
        run: |
          python genCalendar.py

      # Exclusion checks identify tagging/content-quality regressions. They are
      # warning-only so a false positive cannot freeze the public calendar.
      - name: Check generated source exclusions
        continue-on-error: true
        run: |
          python tests/calendar/validate_calendar_source_exclusions.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No repository changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update calendar"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:"${GITHUB_REF_NAME}"

      # Pushes authenticated with GITHUB_TOKEN intentionally do not start most
      # other workflows. Dispatch the site deployment explicitly so freshly
      # generated feeds do not remain newer than the production calendar.
      - name: Deploy updated calendar to production
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cloudflare-deploy.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            --field deploy_target=site
