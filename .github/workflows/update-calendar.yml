name: Update Calendar

on:
  schedule:
    - cron: '15 2 * * *'
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-calendar.yml"
      - "requirements.txt"
      - "genCalendar.py"
      - "genSimpleCalendar.py"
      - "calendar_*.py"
      - "city_source_taxonomy.py"
      - "events_map_generator.py"
      - "geocode*.py"
      - "scrape_*.py"
      - "*/event_sources.py"
      - "*/gen_calendar.py"
      - "*/scrape_*.py"
      - "*/manual_events.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: calendar-data-updates
  cancel-in-progress: false

jobs:
  update_calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendar
        run: python genCalendar.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update calendar"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:"${GITHUB_REF_NAME}"

      - name: Deploy updated calendar to production
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cloudflare-deploy.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            --field deploy_target=site
