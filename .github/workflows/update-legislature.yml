name: Update Legislature

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at 00:00 UTC
  workflow_dispatch:  # Allows manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: repository-data-updates
  cancel-in-progress: false

jobs:
  update_legislature:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Determine whether to refresh Baltimore profile images
        id: baltimore_images
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            echo "refresh_profile_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh_profile_images=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Maryland bills cache
        run: |
          python fetch_mdbills_cache.py

      - name: Refresh Maryland hearings / testimony cache
        run: |
          python fetch_mdbills_hearings_cache.py

      - name: Refresh Maryland bill votes cache
        run: |
          python fetch_mdbills_votes_cache.py

      - name: Refresh Baltimore testimony cache
        run: |
          if [ "${{ steps.baltimore_images.outputs.refresh_profile_images }}" = "true" ]; then
            python baltimore/testimony/fetch_bills.py --refresh-profile-images
          else
            python baltimore/testimony/fetch_bills.py
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No repository changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            baltimore/testimony/data/city_council_testimony.json \
            baltimore/testimony/images \
            data/maryland_bills_2026.json \
            data/maryland_bill_hearings_2026.json \
            data/maryland_bill_votes_2026.json
          git commit -m "Update legislative data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:"${GITHUB_REF_NAME}"
