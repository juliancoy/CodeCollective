name: Import LifeTech Event History

on:
  workflow_dispatch:
    inputs:
      release_backend:
        description: Release the pinned OrgPortal backend before importing
        type: boolean
        default: false
      sync_ingest_credential:
        description: Synchronize the canonical ingestion credential
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lifetech-history-import
  cancel-in-progress: false

jobs:
  import_history:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check out reviewed OrgPortal ingestion changes
        uses: actions/checkout@v4
        with:
          repository: juliancoy/OrgPortal
          ref: ca750df3a7aeabc85af2b696b7cf1a4279fbfa09
          path: OrgPortal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci --prefix OrgPortal/org-worker
          pip install requests
      - name: Validate OrgPortal changes
        working-directory: OrgPortal/org-worker
        run: |
          npm run build:metadata
          node --import tsx --test test/calendar-collections.test.ts test/org-worker.test.ts
          npm run typecheck
          npx wrangler deploy --dry-run
      - name: Release OrgPortal collection ingestion
        if: inputs.release_backend
        working-directory: OrgPortal/org-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
      - name: Synchronize the canonical calendar ingestion credential
        if: inputs.sync_ingest_credential
        working-directory: OrgPortal/org-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORG_INGEST_TOKEN: ${{ secrets.ORG_BACKEND_INGEST_TOKEN }}
        run: |
          python - <<'PYTHON'
          import os, subprocess
          token = os.environ['ORG_INGEST_TOKEN'].strip()
          if not token:
              raise RuntimeError('Missing canonical ingestion credential')
          subprocess.run(['npx', 'wrangler', 'secret', 'put', 'ORG_INGEST_TOKEN'],
                         input=token, text=True, check=True)
          PYTHON
      - name: Import and verify reviewed LifeTech events
        env:
          ORG_BACKEND_INGEST_URL: https://org-codecollective.jcloiacon.workers.dev/api/network/ingest/calendar
          ORG_BACKEND_INGEST_TOKEN: ${{ secrets.ORG_BACKEND_INGEST_TOKEN }}
        run: |
          python scripts/import_lifetech_history.py \
            --payload baltimore/incubation_history/lifetech-import.json \
            --portal-dir OrgPortal --receipt lifetech-import-receipt.json
      - name: Save import receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifetech-event-history-receipt
          path: lifetech-import-receipt.json
          if-no-files-found: ignore
