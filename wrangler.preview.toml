# Intentionally no production routes, databases, buckets, queues, or API origins.
name = "codecollective-site-preview"
main = "cloudflare/worker.js"
compatibility_date = "2026-04-24"
workers_dev = false
preview_urls = false

[assets]
directory = ".cloudflare/preview"
binding = "ASSETS"
run_worker_first = true

[vars]
WEB_PREVIEW = "true"
